[package]
name = "xfactor-os"
version = "0.4.0"
description = "xFactor.OS — controlled chaos for builders, creators, and operators."
authors = ["xFactor / planet.X"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "xfactor_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
# Terminal native open/save dialogs and user-selected text-file access.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
