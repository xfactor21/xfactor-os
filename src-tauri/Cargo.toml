[package]
name = "xfactor-os"
version = "0.8.0"
description = "xFactor.OS — controlled chaos for builders, creators, and operators."
authors = ["xFactor / planet.X"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "xfactor_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.11.5", features = ["tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "=2.4.0", features = ["sqlite"] }
# Terminal native open/save dialogs and user-selected text-file access.
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-persisted-scope = "2.3.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
serde_json = "1"
url = "2"
