name: Repair npm audit lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/repair-audit-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: designlab-wireframe-2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply safe audit updates to manifest/lockfile
        run: npm audit fix --package-lock-only
      - name: Verify production audit after repair
        run: npm audit --omit=dev --audit-level=high
      - name: Verify full audit after repair
        run: npm audit --audit-level=high
      - name: Commit repaired dependency lock if changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: patch newly disclosed npm dependency advisories'
          git push origin HEAD:designlab-wireframe-2
