name: Verify Release Candidate

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes in runner
        run: npm audit fix
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify full dependency audit
        run: npm audit --audit-level=high
      - run: npm run test:release
      - run: npm run lint
      - run: npm run build
      - name: Upload repaired lockfile
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
