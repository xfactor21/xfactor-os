name: Verify Release Candidate

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full dependency tree
        run: npm audit --audit-level=high
      - run: npm run test:release
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium smoke runner
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/xfactor-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/xfactor-preview.log
          exit 1
      - name: Browser runtime smoke
        run: node scripts/browser-smoke.mjs
