name: Cloud Sync Freshness Codemod

on:
  pull_request:
    branches: ['main']
    paths:
      - 'scripts/apply-cloud-sync-freshness-fix.mjs'
      - '.github/workflows/cloud-sync-freshness-codemod.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply fail-closed codemod
        run: node scripts/apply-cloud-sync-freshness-fix.mjs
      - name: Verify generated contract
        run: node scripts/cloud-sync-clock-smoke.mjs
      - name: Check diff
        run: git diff --check
      - name: Commit generated repair
        run: |
          git config user.name "xFactor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make cloud sync freshness whole-workspace aware"
          git push origin HEAD:${{ github.head_ref }}
