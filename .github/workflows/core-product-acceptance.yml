name: Core Product Acceptance

on:
  pull_request:
    paths:
      - 'src/xfactor/**'
      - 'src/lib/supabase.ts'
      - 'src/components/CaptureWidget.tsx'
      - 'src/modules/terminal/**'
      - 'scripts/core-product-smoke.mjs'
      - '.github/workflows/core-product-acceptance.yml'
  workflow_dispatch:

jobs:
  core-product:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/xfactor-core-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/xfactor-core-preview.log
          exit 1
      - name: Core product browser acceptance
        run: node scripts/core-product-smoke.mjs
