name: Hosted Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/workbench-browser-smoke.mjs'
      - 'scripts/design-lab-browser-smoke.mjs'
      - 'public/manifest.webmanifest'
      - 'public/sw.js'
      - 'vercel.json'
      - '.github/workflows/hosted-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [product, workbench, design-lab]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium smoke runner
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Wait for Vercel production to become reachable
        run: |
          for i in {1..60}; do
            if curl -fsS https://xfactor-os-xfactor21s-projects.vercel.app/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Production URL did not become reachable in time"
          exit 1
      - name: Verify hosted PWA shell
        if: matrix.shard == 'product'
        run: |
          curl -fsS https://xfactor-os-xfactor21s-projects.vercel.app/manifest.webmanifest | grep -q '"name": "xFactor.OS — Controlled Chaos"'
          curl -fsSI https://xfactor-os-xfactor21s-projects.vercel.app/sw.js | grep -qi 'service-worker-allowed: /'
          curl -fsSI https://xfactor-os-xfactor21s-projects.vercel.app/pwa-icon-512.png | grep -qi 'content-type: image/png'
      - name: Product + spatial hosted acceptance
        if: matrix.shard == 'product'
        env:
          XFACTOR_BASE_URL: https://xfactor-os-xfactor21s-projects.vercel.app
        run: node scripts/browser-smoke.mjs
      - name: Workbench hosted acceptance
        if: matrix.shard == 'workbench'
        env:
          XFACTOR_BASE_URL: https://xfactor-os-xfactor21s-projects.vercel.app
        run: node scripts/workbench-browser-smoke.mjs
      - name: Design Lab hosted acceptance
        if: matrix.shard == 'design-lab'
        env:
          XFACTOR_BASE_URL: https://xfactor-os-xfactor21s-projects.vercel.app
        run: node scripts/design-lab-browser-smoke.mjs
