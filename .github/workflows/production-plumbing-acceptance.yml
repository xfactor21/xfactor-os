name: Production Plumbing Acceptance

on:
  pull_request:
    branches: ['main']
    paths:
      - 'api/analytics.ts'
      - 'src/lib/supabase.ts'
      - 'src/services/planetxAnalytics.ts'
      - '.github/workflows/production-plumbing-acceptance.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  production-plumbing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check Vercel analytics handler
        run: npx tsc --ignoreConfig --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --types node --skipLibCheck api/analytics.ts
      - name: Production build
        run: npm run build
      - name: Verify production cloud target
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://xfactor-os.vercel.app';
          const htmlResponse = await fetch(`${origin}/`, { redirect: 'follow' });
          if (!htmlResponse.ok) throw new Error(`production shell returned ${htmlResponse.status}`);
          const html = await htmlResponse.text();
          const asset = html.match(/<script[^>]+src="([^"]*\/assets\/main-[^"]+\.js)"/)?.[1];
          if (!asset) throw new Error('could not locate production main bundle');
          const bundleResponse = await fetch(new URL(asset, origin));
          if (!bundleResponse.ok) throw new Error(`production bundle returned ${bundleResponse.status}`);
          const bundle = await bundleResponse.text();
          if (!bundle.includes('xyuolxydomqqvdolgckz.supabase.co')) {
            throw new Error('production bundle is not configured for the dedicated xFactor.OS Supabase project');
          }
          console.log('Production cloud target verified against dedicated xFactor.OS Supabase project.');
          NODE
      - name: Send synthetic production analytics audit probe
        run: |
          node --input-type=module <<'NODE'
          const runId = process.env.GITHUB_RUN_ID;
          const attempt = process.env.GITHUB_RUN_ATTEMPT;
          const response = await fetch('https://xfactor-os.vercel.app/api/analytics', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event: 'system_audit_probe',
              timestamp: new Date().toISOString(),
              source_product: 'xfactor-os',
              source_surface: 'github-actions-audit',
              session_id: `github-audit-${runId}-${attempt}`,
              anonymous_user_id: `github-audit-${runId}`,
              path: '/__system_audit__/analytics',
              platform: 'github-actions',
              properties: {
                synthetic: true,
                audit_probe: true,
                github_run_id: runId,
                github_run_attempt: attempt,
                tested_head_sha: process.env.GITHUB_SHA,
              },
            }),
          });
          const text = await response.text();
          if (!response.ok) throw new Error(`production analytics probe returned ${response.status}: ${text.slice(0, 300)}`);
          let body;
          try { body = JSON.parse(text); } catch { throw new Error('production analytics probe returned non-JSON'); }
          if (body?.ok !== true) throw new Error(`production analytics probe did not confirm write: ${text.slice(0, 300)}`);
          console.log(`Synthetic production analytics audit probe accepted for GitHub run ${runId}.`);
          NODE
