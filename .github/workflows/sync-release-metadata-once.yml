name: Sync release metadata once

on:
  push:
    branches: ['release-0.5.0-version-sync']

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-0.5.0-version-sync
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Synchronize version-bearing lockfiles
        run: node scripts/sync-version.mjs
      - name: Commit synchronized metadata if needed
        run: |
          if git diff --quiet; then
            echo "Release metadata already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "release: synchronize 0.5.0 lock metadata"
          git push origin HEAD:release-0.5.0-version-sync
