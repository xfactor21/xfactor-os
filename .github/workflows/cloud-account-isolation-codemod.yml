name: Cloud Account Isolation Codemod

on:
  pull_request:
    branches: ['main']
    paths:
      - 'scripts/apply-cloud-account-isolation-fix.mjs'
      - '.github/workflows/cloud-account-isolation-codemod.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply fail-closed codemod
        run: node scripts/apply-cloud-account-isolation-fix.mjs
      - name: Verify generated contract
        run: node scripts/cloud-account-isolation-smoke.mjs
      - name: Check diff
        run: git diff --check
      - name: Commit product repair
        run: |
          git config user.name "xFactor CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/xfactor/ChaosDeck.tsx scripts/cloud-account-isolation-smoke.mjs
          git commit -m "fix: isolate async cloud sync across auth transitions"
          git push origin HEAD:${{ github.head_ref }}
