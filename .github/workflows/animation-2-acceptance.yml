name: Animation 2.0 Acceptance

on:
  pull_request:
    paths:
      - 'src/modules/studio/Animation.tsx'
      - 'src/modules/studio/animation/AnimationEngine.ts'
      - 'scripts/animation-smoke.mjs'
      - '.github/workflows/animation-2-acceptance.yml'
  workflow_dispatch:

jobs:
  animation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/xfactor-animation-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/xfactor-animation-preview.log
          exit 1
      - name: Animation browser acceptance
        run: node scripts/animation-smoke.mjs
