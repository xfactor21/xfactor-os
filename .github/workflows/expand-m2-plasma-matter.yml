name: Expand Workbench M2 Plasma Matter

on:
  push:
    branches:
      - feature/workbench-m2-plasma-matter

permissions:
  contents: write

jobs:
  expand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/workbench-m2-plasma-matter
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Expand handoff into reviewable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xfactor-m2
          cat .handoff/matter.b64.* | base64 -d > /tmp/matter.zip
          unzip -q /tmp/matter.zip -d /tmp/xfactor-m2

          python <<'PY'
          from pathlib import Path
          import json

          cargo = Path('src-tauri/Cargo.toml')
          text = cargo.read_text()
          anchor = 'tauri-plugin-fs = "2"'
          if 'tauri-plugin-persisted-scope' not in text:
              if anchor not in text:
                  raise SystemExit('Cargo fs plugin anchor not found')
              text = text.replace(anchor, anchor + chr(10) + 'tauri-plugin-persisted-scope = "2.3.7"', 1)
          cargo.write_text(text)

          lib = Path('src-tauri/src/lib.rs')
          text = lib.read_text()
          anchor = '    .plugin(tauri_plugin_fs::init())'
          addition = '    .plugin(tauri_plugin_persisted_scope::init())'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('Tauri fs init anchor not found')
              text = text.replace(anchor, anchor + chr(10) + addition, 1)
          lib.write_text(text)

          caps_path = Path('src-tauri/capabilities/default.json')
          caps = json.loads(caps_path.read_text())
          wanted = [
              'fs:allow-read-dir',
              'fs:allow-stat',
              'fs:allow-mkdir',
              'fs:allow-remove',
              'fs:allow-rename',
          ]
          permissions = caps.get('permissions', [])
          insert_at = permissions.index('fs:allow-read-text-file') if 'fs:allow-read-text-file' in permissions else len(permissions)
          for permission in reversed(wanted):
              if permission not in permissions:
                  permissions.insert(insert_at, permission)
          caps['permissions'] = permissions
          caps_path.write_text(json.dumps(caps, indent=2) + chr(10))
          PY

          python <<'PY'
          from pathlib import Path
          import json

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg.setdefault('dependencies', {})['@cruxgarden/plasma-ui'] = '0.7.0'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          chaos = Path('src/xfactor/ChaosDeck.tsx')
          text = chaos.read_text()

          import_anchor = "import DeveloperWorkbench from './DeveloperWorkbench';"
          import_addition = "import PlasmaSignalWorkspace from './PlasmaSignalWorkspace';\nimport { usePlasmaMode } from './plasmaMode';"
          if import_addition not in text:
              if import_anchor not in text:
                  raise SystemExit('Plasma import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + import_addition, 1)

          hook_line = "  const plasma = usePlasmaMode(chosen?.id);"
          if hook_line not in text:
              anchor = "  const visibleIncidents=useMemo(()=>ws.incidents.filter(i=>!i.archived),[ws.incidents]);"
              if anchor not in text:
                  raise SystemExit('Plasma hook anchor not found')
              text = text.replace(anchor, anchor + '\n' + hook_line, 1)

          root_old = '  return <div className="xf-root">'
          root_new = "  return <div className={`xf-root ${plasma.active ? `xf-plasma-mode plasma-${plasma.look}` : ''}`}>"
          if root_old in text:
              text = text.replace(root_old, root_new, 1)

          status_old = '      <div className="xf-top-status"><span><Radio size={12}/> SIGNAL {signalStrength}%</span><span><Activity size={12}/> {ws.activity.length} EVENTS</span><span className="hot"><Flame size={12}/> {visibleIncidents.filter(i=>i.heat>80).length} HOT</span></div>'
          status_new = '      <div className="xf-top-status"><span><Radio size={12}/> SIGNAL {signalStrength}%</span><span><Activity size={12}/> {ws.activity.length} EVENTS</span><span className="hot"><Flame size={12}/> {visibleIncidents.filter(i=>i.heat>80).length} HOT</span>{plasma.active&&<span className="plasma-status"><Sparkles size={12}/> PLASMA</span>}</div>'
          if status_old in text:
              text = text.replace(status_old, status_new, 1)

          if '<PlasmaSignalWorkspace' not in text:
              signal_start = text.index("{view==='signal' &&")
              signal_end = text.index("{view==='vault' &&", signal_start)
              replacement = """{view==='signal' && <PlasmaSignalWorkspace
                signals={ws.signals}
                incidents={visibleIncidents}
                selectedIncidentId={chosen?.id}
                query={signalQuery}
                onQueryChange={setSignalQuery}
                onUpdate={updateSignal}
                onDelete={signal=>patch(p=>({...p,signals:p.signals.filter(x=>x.id!==signal.id),activity:[event('signal','Removed signal',signal.incidentId),...p.activity]}))}
                plasma={plasma}
              />}

          """
              text = text[:signal_start] + replacement + text[signal_end:]

          chaos.write_text(text)

          smoke = Path('scripts/browser-smoke.mjs')
          text = smoke.read_text()
          anchor = """await check('Incident Developer Workbench opens', async () => {"""
          plasma_check = """await check('Signal Plasma mode is reversible and data-safe', async () => {
            await page.keyboard.press('Control+K');
            const input = page.getByPlaceholder('TYPE WHAT YOU WANT TO DO...');
            await input.fill('open signal');
            await input.press('Enter');
            await page.getByText("DON'T ORGANIZE IT YET.").waitFor();
            const original = page.locator('.signal-row textarea').first();
            const originalText = await original.inputValue();
            await page.getByRole('button', { name: /PLASMA/i }).click();
            await page.locator('.xf-root.xf-plasma-mode').waitFor();
            const plasmaEditor = page.locator('.xf-plasma-note textarea').first();
            await plasmaEditor.waitFor();
            await plasmaEditor.fill(originalText + ' // PLASMA SAFE');
            await page.getByRole('button', { name: 'NORMAL' }).click();
            await page.getByText("DON'T ORGANIZE IT YET.").waitFor();
            const returnedText = await page.locator('.signal-row textarea').first().inputValue();
            if (!returnedText.includes('PLASMA SAFE')) throw new Error('Signal edit did not survive Plasma -> Normal transition');
          });

          """
          if 'Signal Plasma mode is reversible and data-safe' not in text:
              if anchor not in text:
                  raise SystemExit('Plasma browser-smoke anchor not found')
              text = text.replace(anchor, plasma_check + anchor, 1)
          smoke.write_text(text)
          PY

          cp /tmp/xfactor-m2/src/xfactor/DeveloperWorkbench.tsx src/xfactor/DeveloperWorkbench.tsx
          cat /tmp/xfactor-m2/src/xfactor/workbench-m2.css >> src/xfactor/workbench.css
          cp /tmp/xfactor-m2/src/xfactor/localProjectBindings.ts src/xfactor/localProjectBindings.ts
          cp /tmp/xfactor-m2/src/xfactor/GitPanel.tsx src/xfactor/GitPanel.tsx
          cp /tmp/xfactor-m2/src/xfactor/plasmaMode.ts src/xfactor/plasmaMode.ts
          cp /tmp/xfactor-m2/src/xfactor/PlasmaSignalWorkspace.tsx src/xfactor/PlasmaSignalWorkspace.tsx
          cp /tmp/xfactor-m2/src/xfactor/plasmaMode.css src/xfactor/plasmaMode.css
          cp /tmp/xfactor-m2/src/lib/projectFolder.ts src/lib/projectFolder.ts
          cp /tmp/xfactor-m2/src/lib/projectSearch.ts src/lib/projectSearch.ts
          cp /tmp/xfactor-m2/src/lib/problems.ts src/lib/problems.ts
          cp /tmp/xfactor-m2/src/lib/gitBridge.ts src/lib/gitBridge.ts
          cp /tmp/xfactor-m2/src-tauri/src/git.rs src-tauri/src/git.rs
          cp /tmp/xfactor-m2/src-tauri/src/lib.m2.rs src-tauri/src/lib.rs
          cp /tmp/xfactor-m2/scripts/m2-pure-tests.mjs scripts/m2-pure-tests.mjs
          cp /tmp/xfactor-m2/scripts/plasma-pure-tests.mjs scripts/plasma-pure-tests.mjs

          python <<'PY'
          from pathlib import Path
          import json

          chaos = Path('src/xfactor/ChaosDeck.tsx')
          text = chaos.read_text()
          old = "return <div className={`xf-root ${plasma.active ? `xf-plasma-mode plasma-${plasma.look}` : ''}`}>"
          new = "return <div className={`xf-root ${plasma.mode === 'plasma' ? `xf-plasma-mode plasma-${plasma.look}` : plasma.mode === 'matter' ? `xf-matter-mode matter-${plasma.look}` : ''}`}>"
          if old not in text:
              raise SystemExit('Matter root-mode anchor not found')
          text = text.replace(old, new, 1)
          old = '{plasma.active&&<span className="plasma-status"><Sparkles size={12}/> PLASMA</span>}'
          new = "{plasma.mode==='plasma'&&<span className=\"plasma-status\"><Sparkles size={12}/> PLASMA</span>}{plasma.mode==='matter'&&<span className=\"matter-status\">◆ MATTER</span>}"
          if old not in text:
              raise SystemExit('Matter status anchor not found')
          text = text.replace(old, new, 1)
          chaos.write_text(text)

          smoke = Path('scripts/browser-smoke.mjs')
          text = smoke.read_text()
          anchor = """await check('Incident Developer Workbench opens', async () => {"""
          matter = """await check('Signal Matter mode uses canonical Signal data', async () => {
            await page.keyboard.press('Control+K');
            const input = page.getByPlaceholder('TYPE WHAT YOU WANT TO DO...');
            await input.fill('open signal');
            await input.press('Enter');
            await page.getByRole('button', { name: /MATTER/i }).click();
            await page.locator('.xf-root.xf-matter-mode').waitFor();
            await page.getByText('THOUGHTS HAVE WEIGHT NOW.').waitFor();
            const editor = page.locator('.xf-matter-note textarea').first();
            await editor.waitFor();
            const value = await editor.inputValue();
            if (!value.includes('PLASMA SAFE')) throw new Error('Matter did not receive the canonical Signal edit');
            await page.getByRole('button', { name: 'NORMAL' }).click();
          });

          """
          if anchor not in text:
              raise SystemExit('Matter browser-smoke anchor not found')
          text = text.replace(anchor, matter + anchor, 1)
          smoke.write_text(text)

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          release = pkg['scripts']['test:release']
          for script in ['node scripts/m2-pure-tests.mjs', 'node scripts/plasma-pure-tests.mjs']:
              if script not in release:
                  release += ' && ' + script
          pkg['scripts']['test:release'] = release
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')
          PY

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

          rm -rf .handoff
          rm -f .github/workflows/expand-m2-plasma-matter.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Workbench M2, Neon Plasma, and Matter Mode"
          git push origin HEAD:feature/workbench-m2-plasma-matter
